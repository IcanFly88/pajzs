<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pajzs — Reklámszűrő iPhone-ra</title>
<style>
  :root { --accent: #0f9d76; --ink: #1a1a1c; --muted: #5f5f66; --bg: #ffffff; --card: #f3f6f5; }
  @media (prefers-color-scheme: dark) {
    :root { --accent: #2fbf8f; --ink: #ececee; --muted: #a1a1aa; --bg: #111214; --card: #1b1d1f; }
  }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); background: var(--bg); line-height: 1.65; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #1fb88a, #08524a);
          display: flex; align-items: center; justify-content: center; font-size: 34px; }
  h1 { font-size: 30px; margin: 20px 0 4px; }
  .muted { color: var(--muted); }
  a.card { display: block; background: var(--card); border-radius: 14px; padding: 14px 20px; margin: 12px 0;
           color: var(--ink); text-decoration: none; font-weight: 600; }
  a.card span { color: var(--accent); float: right; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🛡️</div>
  <h1>Pajzs</h1>
  <p class="muted">Reklámszűrő iPhone-os játékokhoz és appokhoz · Ad blocker for iPhone games and apps</p>
  <a class="card" href="support.html">Támogatás / Support <span>›</span></a>
  <a class="card" href="privacy.html">Adatkezelési tájékoztató / Privacy Policy <span>›</span></a>
</div>
</body>
</html>
